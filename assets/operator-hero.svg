<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="op-title op-desc">
  <title id="op-title">Operator SB &#8212; illustrated dossier portrait</title>
  <desc id="op-desc">Original comic-style scene: stylized operator silhouette with headset, HUD corners, scan lines, and Issue 001 label. Not a photograph.</desc>
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14143f"/>
      <stop offset="55%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="visorGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffd60a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff2d70" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="burst" cx="72%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ff2d70" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050510" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotHalftone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#050510" opacity="0.65"/>
    </pattern>
    <filter id="inkEdge" x="-2%" y="-2%" width="104%" height="104%">
      <feMorphology operator="dilate" radius="1.2" in="SourceAlpha" result="thick"/>
      <feGaussianBlur in="thick" stdDeviation="0.8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.02 0 0 0 0 0.06 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic" in2="blur" mode="normal"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bgSky)"/>
  <rect width="960" height="520" fill="url(#burst)"/>

  <g opacity="0.55" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round">
    <line x1="40" y1="380" x2="220" y2="300"/>
    <line x1="60" y1="420" x2="200" y2="340"/>
    <line x1="780" y1="120" x2="920" y2="60"/>
    <line x1="760" y1="160" x2="940" y2="90"/>
  </g>
  <g opacity="0.4" stroke="#ff2d70" stroke-width="2" stroke-linecap="round">
    <line x1="140" y1="80" x2="280" y2="140"/>
    <line x1="700" y1="360" x2="880" y2="440"/>
  </g>

  <g transform="translate(28, 28)">
    <rect x="0" y="0" width="198" height="34" fill="#ffd60a" stroke="#050510" stroke-width="3"/>
    <text x="99" y="23" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="4" fill="#050510">ISSUE #001</text>
  </g>

  <rect x="28" y="72" width="240" height="22" fill="#050510" stroke="#fef9ed" stroke-width="2" opacity="0.92"/>
  <text x="36" y="88" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="3" fill="#00d4ff">CHANNEL &#183; OPERATOR-VERSE</text>

  <g fill="none" stroke="#ffd60a" stroke-width="5" stroke-linecap="square">
    <path d="M48 420 V472 H120"/>
    <path d="M912 420 V472 H840"/>
    <path d="M48 100 V48 H120"/>
    <path d="M912 100 V48 H840"/>
  </g>
  <g fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.85">
    <path d="M62 434 V458 H98"/>
    <path d="M898 434 V458 H862"/>
  </g>

  <path d="M0 380 Q480 340 960 400 L960 520 L0 520 Z" fill="#050510" opacity="0.55"/>
  <path d="M0 400 L960 455" stroke="#fef9ed" stroke-width="2" opacity="0.15"/>

  <!-- Stylized operator silhouette (original; no trademark costume) -->
  <g transform="translate(480, 300)" filter="url(#inkEdge)">
    <path d="M-140 120 Q-180 40 -120 -20 Q-40 -90 0 -95 Q40 -90 120 -20 Q180 40 140 120 L110 125 Q60 40 0 25 Q-60 40 -110 125 Z" fill="#14143f" stroke="#fef9ed" stroke-width="4"/>
    <rect x="-22" y="-95" width="44" height="38" rx="8" fill="#0a0a2e" stroke="#fef9ed" stroke-width="3"/>
    <ellipse cx="0" cy="-118" rx="78" ry="68" fill="#050510" stroke="#fef9ed" stroke-width="4"/>
    <path d="M-54 -128 Q0 -108 54 -128 L48 -96 Q0 -78 -48 -96 Z" fill="url(#visorGlow)" stroke="#050510" stroke-width="2"/>
    <path d="M62 -72 Q110 -60 130 -20 Q138 20 125 48" fill="none" stroke="#fef9ed" stroke-width="5" stroke-linecap="round"/>
    <circle cx="124" cy="52" r="14" fill="#ff2d70" stroke="#050510" stroke-width="3"/>
    <circle cx="124" cy="52" r="6" fill="#050510"/>
    <ellipse cx="-82" cy="-112" rx="16" ry="28" fill="#14143f" stroke="#00d4ff" stroke-width="3"/>
    <ellipse cx="82" cy="-112" rx="16" ry="28" fill="#14143f" stroke="#ff2d70" stroke-width="3"/>
    <rect x="-36" y="-12" width="72" height="52" rx="6" fill="none" stroke="#00d4ff" stroke-width="3"/>
    <path d="M-28 8 H28 M0 -4 V36" stroke="#ffd60a" stroke-width="3"/>
    <circle cx="0" cy="42" r="5" fill="#ffd60a"/>
  </g>

  <g opacity="0.9">
    <rect x="640" y="88" width="120" height="72" fill="#fef9ed" stroke="#050510" stroke-width="3" transform="rotate(4 700 124)"/>
    <text x="652" y="118" font-family="Impact, 'Arial Black', sans-serif" font-size="28" fill="#ff2d70">SB</text>
    <text x="652" y="142" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#050510">MULTI-LANE BUILD</text>
  </g>

  <g opacity="0.12" stroke="#fef9ed" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="320" x2="960" y2="320"/>
  </g>

  <rect width="960" height="520" fill="url(#dotHalftone)" opacity="0.28" style="mix-blend-mode: multiply"/>

  <rect x="0" y="456" width="960" height="64" fill="#050510" opacity="0.88"/>
  <rect x="0" y="456" width="960" height="4" fill="#ffd60a"/>
  <text x="24" y="488" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#00d4ff">VERIFY &#183; SIMULATE &#183; REFUSE</text>
  <text x="24" y="508" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10" letter-spacing="2" fill="#fef9ed" opacity="0.75">FILE TAG &#183; OPERATOR SB &#183; ILLUSTRATED LIKENESS</text>
</svg>
